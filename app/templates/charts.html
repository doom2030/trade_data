{% extends "base.html" %}
{% block title %}K 线图表{% endblock %}
{% block head %}
<script src="/static/js/lightweight-charts.standalone.production.js"></script>
{% endblock %}
{% block content %}
<div class="page-header">
  <h2>K 线图表</h2>
</div>

<div class="glass-panel chart-toolbar">
  <div class="form-group chart-toolbar-symbol">
    <label class="form-label">股票</label>
    <select class="form-select" id="symbolSelect">
      {% for s in symbols %}
      <option
        value="{{ s.symbol }}"
        data-status="{{ s.status }}"
        data-status-label="{{ status_label(s.status) }}"
        data-board="{{ s.board }}"
        data-board-label="{{ board_label(s.board) }}"
        data-industry="{{ s.current_industry or '' }}"
        {% if s.symbol == default_symbol %}selected{% endif %}
      >
        {{ s.symbol }} {{ s.name }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group chart-toolbar-period">
    <label class="form-label">周期</label>
    <select class="form-select" id="frequency">
      <option value="day" selected>日线</option>
    </select>
  </div>
  <div class="form-group chart-toolbar-adjust">
    <label class="form-label">复权</label>
    <select class="form-select" id="adjust">
      <option value="forward" selected>前复权</option>
    </select>
  </div>
  <div class="form-group chart-toolbar-date">
    <label class="form-label">起始</label>
    <input class="form-input" type="date" id="startDate" value="{{ default_start }}">
  </div>
  <div class="form-group chart-toolbar-date">
    <label class="form-label">结束</label>
    <input class="form-input" type="date" id="endDate" value="{{ default_end }}">
  </div>
  <label class="checkbox-label">
    <input type="checkbox" id="includeExcluded" {% if include_excluded %}checked{% endif %}> 包含已排除
  </label>
  <button class="btn btn-primary" id="loadBtn">加载</button>
</div>

<nav class="chart-tabs glass-panel" id="chartTabs" role="tablist" aria-label="图表视图">
  <button type="button" class="chart-tab active" role="tab" aria-selected="true" data-tab="kline">K 线图</button>
  <button type="button" class="chart-tab" role="tab" aria-selected="false" data-tab="flow">涨跌 · 换手 · 成交量</button>
</nav>

<div class="glass-panel chart-container">
  <div class="stock-info-bar" id="stockInfo"></div>
  <div class="chart-status" id="chartStatus">选择股票并点击加载</div>
  <div class="chart-hover" id="chartHover" hidden></div>

  <div class="chart-panel is-active" data-panel="kline" role="tabpanel">
    <div id="priceChart"></div>
  </div>
  <div class="chart-panel" data-panel="flow" role="tabpanel" hidden>
    <div class="chart-pane-label">涨跌幅</div>
    <div id="pctChgChart"></div>
    <div class="chart-pane-label">换手率 · 相对近 10 日中位数 ≥2 倍标为突增</div>
    <div id="turnChart"></div>
    <div class="chart-pane-label">成交量 · 橙色柱 / 标记为突增日</div>
    <div id="volumeChart"></div>
  </div>
</div>
<div id="jobStatus" class="chart-status" style="margin-top:12px"></div>
{% endblock %}
{% block scripts %}
<script>
  window.CHART_CONFIG = {
    maxNaturalDays: {{ max_natural_days }},
    defaultSymbol: "{{ default_symbol or '' }}",
  };
</script>
<script src="/static/js/charts.js?v=6"></script>
{% endblock %}
